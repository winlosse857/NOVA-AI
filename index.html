<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STANDOFF 2 CLICKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f0c;
  --panel:#15180f;
  --panel2:#101208;
  --line:#2a2e21;
  --accent:#e8a33d;
  --accent-dim:#a8711f;
  --passive:#7c9470;
  --danger:#c6453f;
  --gold:#f2c94c;
  --text:#dad4c3;
  --muted:#8a8e78;
  --font-display:'Russo One','Arial Narrow',Impact,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 15% -10%, rgba(232,163,61,.08), transparent 45%),
    radial-gradient(ellipse at 100% 110%, rgba(198,69,63,.07), transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  display:flex;
  justify-content:center;
  padding:28px 16px 60px;
}
.page{width:100%;max-width:880px;}
.title-row{margin-bottom:18px;}
.title-row h1{
  font-family:var(--font-display);
  font-size:clamp(22px,4vw,30px);
  letter-spacing:1px;
  margin:0 0 4px;
  color:var(--text);
}
.title-row .subtitle{margin:0;color:var(--muted);font-size:13px;}
.hud{
  background:var(--panel);
  border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));
  padding:18px 22px;
  margin-bottom:16px;
}
.hud-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;}
.rank-name{color:var(--accent);font-weight:700;font-size:14px;margin-bottom:4px;}
.balance{font-family:var(--font-display);font-size:clamp(28px,6vw,40px);line-height:1;}
.balance small{font-family:var(--font-body);font-size:14px;color:var(--muted);font-weight:400;margin-left:6px;}
.hud-stats{display:flex;gap:16px;color:var(--muted);font-size:13px;flex-wrap:wrap;}
.hud-stats b{color:var(--text);font-weight:600;}
.progress-track{height:6px;background:var(--panel2);margin-top:14px;border:1px solid var(--line);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));width:0%;transition:width .4s ease;}
.rank-next{font-size:12px;color:var(--muted);margin-top:6px;}
.game{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;}
@media (max-width:700px){.game{grid-template-columns:1fr;}}
.click-zone{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:36px 20px;min-height:360px;overflow:hidden;
}
.weapon-btn{
  width:168px;height:168px;
  clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);
  background:radial-gradient(circle at 35% 30%,#262a1d,#0f110a 72%);
  border:2px solid var(--accent);
  color:var(--accent);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .08s ease;
  animation:pulse 2.6s infinite;
  padding:0;
}
.weapon-btn:active{transform:scale(.93);}
.weapon-btn:focus-visible{outline:3px solid var(--gold);outline-offset:4px;}
@keyframes pulse{
  0%,100%{filter:drop-shadow(0 0 6px rgba(232,163,61,.25));}
  50%{filter:drop-shadow(0 0 26px rgba(232,163,61,.55));}
}
.click-caption{margin-top:18px;color:var(--muted);font-size:13px;text-align:center;}
.click-caption b{color:var(--text);}
.combo{margin-top:6px;min-height:18px;color:var(--danger);font-weight:700;font-size:13px;}
.float-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.float-text{position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  font-weight:800;color:var(--accent);font-size:17px;
  animation:floatUp .9s ease-out forwards;white-space:nowrap;pointer-events:none;
  text-shadow:0 2px 6px rgba(0,0,0,.6);}
.float-text.crit{color:var(--gold);font-size:22px;}
@keyframes floatUp{
  from{opacity:1;transform:translate(-50%,-50%);}
  to{opacity:0;transform:translate(-50%,calc(-50% - 74px));}
}
.arsenal{background:var(--panel);border:1px solid var(--line);padding:16px;max-height:420px;overflow-y:auto;}
.arsenal h2{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--text);}
.shop-item{display:flex;align-items:center;gap:12px;padding:10px 8px;
  border-left:3px solid var(--line);border-bottom:1px solid var(--line);}
.shop-item.disabled{opacity:.5;}
.shop-item:last-child{border-bottom:none;}
.shop-icon{font-size:24px;width:30px;text-align:center;flex-shrink:0;}
.shop-info{flex:1;min-width:0;}
.shop-name{font-size:13.5px;font-weight:600;color:var(--text);}
.shop-level{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px;}
.shop-desc{color:var(--muted);font-size:12px;margin-top:2px;}
.buy-btn{background:var(--accent);color:#1c1200;border:none;padding:8px 12px;
  font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;border-radius:2px;}
.buy-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}
.buy-btn:not(:disabled):hover{background:var(--gold);}
.footer{display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;color:var(--muted);font-size:12.5px;flex-wrap:wrap;gap:10px;}
.footer-stats{display:flex;gap:16px;flex-wrap:wrap;}
.footer-stats b{color:var(--text);font-weight:600;}
.footer-actions{display:flex;gap:8px;}
.footer-actions button{background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:7px 12px;font-size:12.5px;cursor:pointer;border-radius:2px;}
.footer-actions button:hover{border-color:var(--accent);color:var(--accent);}
#resetBtn:hover{border-color:var(--danger);color:var(--danger);}
.banner{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-140%);
  background:var(--accent);color:#1c1200;padding:12px 24px;font-weight:700;
  font-family:var(--font-display);font-size:14px;letter-spacing:.5px;
  box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:50;transition:transform .4s ease;}
.banner.show{transform:translateX(-50%) translateY(0);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
.modal-box{background:var(--panel);border:1px solid var(--accent);max-width:340px;padding:26px;text-align:center;}
.modal-box h3{margin:0 0 10px;font-family:var(--font-display);font-size:17px;color:var(--accent);}
.modal-box p{color:var(--text);font-size:14px;line-height:1.5;margin:0;}
.modal-box button{margin-top:16px;background:var(--accent);border:none;color:#1c1200;
  padding:10px 22px;font-weight:700;cursor:pointer;border-radius:2px;}
@media (prefers-reduced-motion:reduce){
  .weapon-btn{animation:none;}
  .float-text{animation:none;}
  .progress-fill{transition:none;}
  .banner{transition:none;}
}
</style>
</head>
<body>
<div class="page">

  <div class="title-row">
    <h1>STANDOFF 2 CLICKER</h1>
    <p class="subtitle">Неофициальный фан-кликер, не связанный с Axlebolt</p>
  </div>

  <div class="hud">
    <div class="hud-row">
      <div>
        <div class="rank-name" id="rankName">Новобранец</div>
        <div class="balance"><span id="balance">0</span><small> монет</small></div>
      </div>
      <div class="hud-stats">
        <span>за клик <b id="perClick">1</b></span>
        <span>в секунду <b id="perSecond">0</b></span>
        <span>крит <b id="critChance">5</b>%</span>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="rank-next" id="rankNext"></div>
  </div>

  <div class="game">
    <div class="click-zone" id="clickZone">
      <button class="weapon-btn" id="clickBtn" aria-label="Нажать, чтобы заработать монеты">
        <svg viewBox="0 0 100 100" width="60" height="60">
          <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="4"/>
          <circle cx="50" cy="50" r="4.5" fill="currentColor"/>
          <line x1="50" y1="4" x2="50" y2="24" stroke="currentColor" stroke-width="4"/>
          <line x1="50" y1="76" x2="50" y2="96" stroke="currentColor" stroke-width="4"/>
          <line x1="4" y1="50" x2="24" y2="50" stroke="currentColor" stroke-width="4"/>
          <line x1="76" y1="50" x2="96" y2="50" stroke="currentColor" stroke-width="4"/>
        </svg>
      </button>
      <div class="click-caption">Клик по прицелу приносит <b id="clickCaptionPower">1</b> монет</div>
      <div class="combo" id="comboDisplay"></div>
      <div class="float-layer" id="floatLayer"></div>
    </div>

    <div class="arsenal">
      <h2>Арсенал</h2>
      <div id="shopList"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-stats">
      <span>Заработано всего <b id="totalEarned">0</b></span>
      <span>Кликов <b id="totalClicks">0</b></span>
    </div>
    <div class="footer-actions">
      <button id="soundBtn">Звук: вкл</button>
      <button id="resetBtn">Сбросить прогресс</button>
    </div>
  </div>

</div>

<div class="banner" id="rankBanner"></div>

<script>
const SAVE_KEY = 'standoff2_clicker_v1';

const UPGRADES = [
  {id:'clickBoost', name:'Прокачка прицела', desc:'+1 монета за клик', baseCost:25, growth:1.15, type:'click', value:1, icon:'🎯'},
  {id:'bot', name:'Бот-новичок', desc:'+1 монете в секунду', baseCost:50, growth:1.14, type:'passive', value:1, icon:'🤖'},
  {id:'sniper', name:'Снайпер на позиции', desc:'+5 монет в секунду', baseCost:400, growth:1.15, type:'passive', value:5, icon:'🪖'},
  {id:'crit', name:'Тренировка на хедшоты', desc:'+3% шанс крита (×3 монет)', baseCost:350, growth:1.22, type:'crit', value:0.03, icon:'💥'},
  {id:'case', name:'VIP-кейс', desc:'+40 монет в секунду', baseCost:5000, growth:1.16, type:'passive', value:40, icon:'📦'},
  {id:'squad', name:'Полный отряд', desc:'+250 монет в секунду', baseCost:50000, growth:1.17, type:'passive', value:250, icon:'👥'},
  {id:'skin', name:'Редкий скин оружия', desc:'+3 монеты за клик', baseCost:9000, growth:1.2, type:'click', value:3, icon:'🔪'},
];

const RANKS = [
  {name:'Новобранец', min:0},
  {name:'Рядовой', min:500},
  {name:'Ефрейтор', min:2500},
  {name:'Сержант', min:12000},
  {name:'Лейтенант', min:60000},
  {name:'Капитан', min:250000},
  {name:'Майор', min:1000000},
  {name:'Полковник', min:5000000},
  {name:'Генерал', min:25000000},
  {name:'Легенда Standoff', min:150000000},
];

let state = {
  balance:0, totalEarned:0, perClick:1, perSecond:0, clicks:0,
  critChance:0.05, critMultiplier:3, upgrades:{}, soundOn:true, lastSeen:Date.now()
};
let combo=0, comboTimer=null, lastRankIdx=0, audioCtx=null, bannerTimer=null;

const $ = id => document.getElementById(id);
const balanceEl=$('balance'), perClickEl=$('perClick'), perSecondEl=$('perSecond'),
  critChanceEl=$('critChance'), rankNameEl=$('rankName'), progressFill=$('progressFill'),
  rankNextEl=$('rankNext'), clickBtn=$('clickBtn'), clickZone=$('clickZone'),
  floatLayer=$('floatLayer'), comboDisplay=$('comboDisplay'), shopList=$('shopList'),
  totalEarnedEl=$('totalEarned'), totalClicksEl=$('totalClicks'), resetBtn=$('resetBtn'),
  soundBtn=$('soundBtn'), rankBanner=$('rankBanner'), clickCaptionPower=$('clickCaptionPower');

function formatNumber(num){
  num = Math.floor(num);
  if(num < 1000) return num.toString();
  const units=['','K','M','B','T','Qa','Qi'];
  let i=0, n=num;
  while(n>=1000 && i<units.length-1){ n/=1000; i++; }
  return (n<10? n.toFixed(2) : n<100? n.toFixed(1) : Math.floor(n)) + units[i];
}
function getRankIndex(){
  let idx=0;
  for(let i=0;i<RANKS.length;i++) if(state.totalEarned>=RANKS[i].min) idx=i;
  return idx;
}
function getCost(upg){
  const lvl = state.upgrades[upg.id]||0;
  return Math.ceil(upg.baseCost * Math.pow(upg.growth, lvl));
}
function playSound(crit){
  if(!state.soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type = crit?'sawtooth':'square';
    osc.frequency.setValueAtTime(crit?340:220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(crit?90:60, audioCtx.currentTime+0.09);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.12);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+0.12);
  }catch(e){}
}
function spawnFloat(x,y,amount,crit){
  const d=document.createElement('div');
  d.className='float-text'+(crit?' crit':'');
  d.textContent=(crit?'КРИТ +':'+')+formatNumber(amount);
  d.style.left=x+'px'; d.style.top=y+'px';
  floatLayer.appendChild(d);
  setTimeout(()=>d.remove(),900);
}

function handleClick(e){
  combo=Math.min(combo+1,50);
  clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>{combo=0; comboDisplay.textContent='';},1200);

  const comboMult=1+Math.min(combo*0.02,1);
  const isCrit=Math.random()<state.critChance;
  const earned=state.perClick*comboMult*(isCrit?state.critMultiplier:1);

  state.balance+=earned; state.totalEarned+=earned; state.clicks++;

  const rect=clickZone.getBoundingClientRect();
  const x=(e.clientX||(rect.left+rect.width/2))-rect.left;
  const y=(e.clientY||(rect.top+rect.height/2))-rect.top;
  spawnFloat(x,y,earned,isCrit);

  comboDisplay.textContent = combo>2 ? `Комбо ×${combo}` : '';
  playSound(isCrit);
  checkRankUp();
  updateUI();
}

function checkRankUp(){
  const idx=getRankIndex();
  if(idx>lastRankIdx){
    lastRankIdx=idx;
    showBanner(`Новое звание: ${RANKS[idx].name}`);
  }
}
function showBanner(text){
  rankBanner.textContent=text;
  rankBanner.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer=setTimeout(()=>rankBanner.classList.remove('show'),2600);
}

function buyUpgrade(id){
  const upg=UPGRADES.find(u=>u.id===id);
  const cost=getCost(upg);
  if(state.balance<cost) return;
  state.balance-=cost;
  state.upgrades[id]=(state.upgrades[id]||0)+1;
  if(upg.type==='click') state.perClick+=upg.value;
  else if(upg.type==='passive') state.perSecond+=upg.value;
  else if(upg.type==='crit') state.critChance=Math.min(state.critChance+upg.value,0.75);
  renderShop(); updateUI(); save();
}

const TYPE_COLORS = {click:'var(--accent)', passive:'var(--passive)', crit:'var(--danger)'};

function renderShop(){
  shopList.innerHTML='';
  UPGRADES.forEach(upg=>{
    const lvl=state.upgrades[upg.id]||0;
    const cost=getCost(upg);
    const can=state.balance>=cost;
    const item=document.createElement('div');
    item.className='shop-item'+(can?'':' disabled');
    item.style.borderLeftColor = can ? (TYPE_COLORS[upg.type]||'var(--accent)') : 'var(--line)';
    item.innerHTML=`
      <div class="shop-icon">${upg.icon}</div>
      <div class="shop-info">
        <div class="shop-name">${upg.name}<span class="shop-level">ур. ${lvl}</span></div>
        <div class="shop-desc">${upg.desc}</div>
      </div>
      <button class="buy-btn" data-id="${upg.id}" ${can?'':'disabled'}>${formatNumber(cost)}</button>
    `;
    shopList.appendChild(item);
  });
}

function updateUI(){
  balanceEl.textContent=formatNumber(state.balance);
  perClickEl.textContent=formatNumber(state.perClick);
  perSecondEl.textContent=formatNumber(state.perSecond);
  clickCaptionPower.textContent=formatNumber(state.perClick);
  critChanceEl.textContent=Math.round(state.critChance*100);
  totalEarnedEl.textContent=formatNumber(state.totalEarned);
  totalClicksEl.textContent=formatNumber(state.clicks);

  const idx=getRankIndex();
  rankNameEl.textContent=RANKS[idx].name;
  const next=RANKS[idx+1];
  if(next){
    const span=next.min-RANKS[idx].min;
    const progress=Math.min(100,((state.totalEarned-RANKS[idx].min)/span)*100);
    progressFill.style.width=progress+'%';
    rankNextEl.textContent=`До звания «${next.name}»: ${formatNumber(Math.max(0,next.min-state.totalEarned))}`;
  }else{
    progressFill.style.width='100%';
    rankNextEl.textContent='Максимальное звание достигнуто';
  }
}

function save(){
  state.lastSeen=Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}
function load(){
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw){
    try{
      const saved=JSON.parse(raw);
      Object.assign(state, saved);
      lastRankIdx=getRankIndex();
      const elapsedSec=Math.min((Date.now()-(saved.lastSeen||Date.now()))/1000, 8*3600);
      if(elapsedSec>30 && state.perSecond>0){
        const gain=state.perSecond*elapsedSec;
        state.balance+=gain; state.totalEarned+=gain;
        setTimeout(()=>showOfflineModal(gain, elapsedSec), 300);
      }
    }catch(e){ console.warn('save corrupted', e); }
  }
  renderShop();
  updateUI();
  soundBtn.textContent = state.soundOn ? 'Звук: вкл' : 'Звук: выкл';
}
function showOfflineModal(gain, sec){
  const mins=Math.floor(sec/60);
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`
    <div class="modal-box">
      <h3>С возвращением, боец</h3>
      <p>Пока тебя не было (${mins} мин), отряд заработал<br><b>${formatNumber(gain)} монет</b></p>
      <button id="offlineOk">Забрать</button>
    </div>`;
  document.body.appendChild(overlay);
  $('offlineOk').onclick=()=>{ overlay.remove(); updateUI(); save(); };
}

clickBtn.addEventListener('click', handleClick);
shopList.addEventListener('click', e=>{
  const btn=e.target.closest('.buy-btn');
  if(btn) buyUpgrade(btn.dataset.id);
});
resetBtn.addEventListener('click', ()=>{
  if(confirm('Точно сбросить весь прогресс? Это нельзя отменить.')){
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }
});
soundBtn.addEventListener('click', ()=>{
  state.soundOn=!state.soundOn;
  soundBtn.textContent = state.soundOn ? 'Звук: вкл' : 'Звук: выкл';
  save();
});

setInterval(()=>{
  if(state.perSecond>0){
    const gain=state.perSecond/5;
    state.balance+=gain; state.totalEarned+=gain;
    checkRankUp();
    updateUI();
  }
},200);
setInterval(save, 10000);
window.addEventListener('beforeunload', save);

load();
</script>
</body>
  </html>
