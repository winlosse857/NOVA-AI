<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Спарк</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15152b;
    --bg-2: #1c1c38;
    --panel: #20203f;
    --violet: #8338EC;
    --coral: #FF5D73;
    --amber: #FFBE0B;
    --text: #F2F0FF;
    --text-dim: #ABA8D6;
    --border: rgba(242,240,255,0.1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
  #app { height: 100%; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
  header { position: sticky; top: 0; z-index: 5; padding: 22px 20px 18px; background: var(--bg-2); border-bottom: 1px solid var(--border); overflow: hidden; }
  .blob { position: absolute; top: -60%; right: -10%; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--violet), transparent 70%); opacity: 0.35; filter: blur(30px); animation: drift 14s ease-in-out infinite; pointer-events: none; }
  @keyframes drift { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-30px, 20px) scale(1.15); } }
  header h1 { position: relative; font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  header p { position: relative; margin: 4px 0 0; color: var(--text-dim); font-size: 0.92rem; }
  #thread { flex: 1; overflow-y: auto; padding: 24px 18px 12px; display: flex; flex-direction: column; gap: 14px; }
  .empty-state { margin: auto; text-align: center; color: var(--text-dim); padding: 0 20px; }
  .empty-state .spark { font-family: 'Space Grotesk', sans-serif; font-size: 2.2rem; font-weight: 700; background: linear-gradient(120deg, var(--coral), var(--amber), var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }
  .bubble { max-width: 80%; padding: 12px 16px; font-size: 0.98rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .row.user .bubble { background: var(--coral); color: #1A1A2E; font-weight: 500; border-radius: 18px 18px 4px 18px; }
  .row.assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-radius: 4px 18px 18px 18px; box-shadow: 0 0 24px -8px var(--violet); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-5px); opacity: 1; } }
  form#composer { display: flex; gap: 10px; padding: 14px 16px; background: var(--bg-2); border-top: 1px solid var(--border); }
  #input { flex: 1; resize: none; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.98rem; padding: 12px 14px; max-height: 140px; outline: none; }
  #input:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(131,56,236,0.25); }
  button#send { flex-shrink: 0; width: 48px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--coral), var(--violet)); color: white; font-size: 1.2rem; cursor: pointer; transition: transform 0.15s ease; }
  button#send:hover { transform: scale(1.05); }
  button#send:active { transform: scale(0.95); }
  button#send:disabled { opacity: 0.5; cursor: default; transform: none; }
  .error-banner { margin: 0 18px; padding: 10px 14px; background: rgba(255,93,115,0.15); border: 1px solid var(--coral); border-radius: 10px; color: var(--coral); font-size: 0.88rem; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="blob"></div>
    <h1>Спарк</h1>
    <p>Маленький ИИ-собеседник с характером</p>
  </header>
  <div id="thread">
    <div class="empty-state" id="emptyState">
      <div class="spark">Привет!</div>
      <div>Спроси что угодно — я отвечу.</div>
    </div>
  </div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Напиши сообщение…" autofocus></textarea>
    <button id="send" type="submit" aria-label="Отправить">➤</button>
  </form>
</div>

<script>
  // ЗАМЕНИ на адрес своего бэкенда на Render (появится после деплоя)
  const API_URL = 'https://ТВОЙ-СЕРВИС.onrender.com/api/chat';

  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('emptyState');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let history = [];

  function showError(msg) {
    const el = document.createElement('div');
    el.className = 'error-banner';
    el.textContent = msg;
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
  }

  function addBubble(role, text) {
    if (emptyState) emptyState.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }

  function addTyping() {
    if (emptyState) emptyState.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }

  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  async function getAIResponse(historyMessages) {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: historyMessages })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Ошибка запроса');
    return data.text || '…';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addBubble('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    addTyping();
    try {
      const reply = await getAIResponse(history);
      removeTyping();
      addBubble('assistant', reply);
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      removeTyping();
      showError(err.message || 'Что-то пошло не так. Попробуй ещё раз.');
    }
    sendBtn.disabled = false;
    input.focus();
  });
</script>
</body>
  </html>
